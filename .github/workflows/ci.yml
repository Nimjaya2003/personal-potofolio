name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Validate HTML
        run: npx --yes html-validate "**/*.html"

      - name: Check for broken links
        run: npx --yes linkinator . --recurse --skip "^http"
